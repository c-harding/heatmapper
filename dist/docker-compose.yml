services:
  heatmapper:
    # Configuration comes from the host at run time rather than a copy baked into the image, so a
    # worktree can run without an env file of its own.
    env_file:
      - ${DOTENV_FILE:-./.env}
    # Named here so that setting one of these in the shell overrides the file above, and reaches
    # both the container and the port mapping below.
    environment:
      - SERVER_PORT
    restart: always
    build: .
    ports:
      - '${SERVER_PORT:-8080}:${SERVER_PORT:-8080}'
    volumes:
      - ./sessions:/usr/src/app/dist/server/sessions
